name: Unified Deployment

on:
  push:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # Hardcoded environment as requested
    environment: Deploy
    # NOTE: The dynamic way to handle environments based on branch would be:
    # environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Prepare Tags and Config
        id: prepare
        run: |
          # 1. Normalize variables to lowercase for Docker compliance
          LOW_REGISTRY=$(echo "${{ secrets.DOCKER_REGISTRY_URL }}" | tr '[:upper:]' '[:lower:]')
          LOW_ORG=$(echo "${{ secrets.DOCKER_ORG }}" | tr '[:upper:]' '[:lower:]')
          LOW_IMAGE=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          BASE_PATH="${LOW_REGISTRY}/${LOW_ORG}/${LOW_IMAGE}"

          # 2. Branch-specific Tagging Logic
          if [ "${{ github.ref_name }}" == "main" ]; then
            VERSION=$(cat ci/version.txt 2>/dev/null || echo "latest")
            echo "tags=${BASE_PATH}:${VERSION},${BASE_PATH}:latest" >> $GITHUB_OUTPUT
            echo "apps_file=ci/apps.json" >> $GITHUB_OUTPUT
          else
            CLEAN_BRANCH=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
            echo "tags=${BASE_PATH}:${CLEAN_BRANCH}" >> $GITHUB_OUTPUT

            if [ -f "ci/apps-${{ github.ref_name }}.json" ]; then
              echo "apps_file=ci/apps-${{ github.ref_name }}.json" >> $GITHUB_OUTPUT
            else
              echo "apps_file=ci/apps.json" >> $GITHUB_OUTPUT
            fi
          fi
          echo "base_path=${BASE_PATH}" >> $GITHUB_OUTPUT

      - name: Load Build Environment
        id: versions
        run: |
          if [ -f "ci/build.env" ]; then
            source ci/build.env
            echo "FRAPPE_VERSION=${FRAPPE_VERSION}" >> $GITHUB_OUTPUT
            echo "PYTHON_VERSION=${PYTHON_VERSION}" >> $GITHUB_OUTPUT
            echo "NODE_VERSION=${NODE_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "ERROR: ci/build.env not found!"
            exit 1
          fi

      - name: Validate and Encode apps.json
        id: encode
        run: |
          APPS_FILE="${{ steps.prepare.outputs.apps_file }}"
          echo "Processing file: $APPS_FILE"

          # Debug: Print the content of the apps file to the logs
          echo "--- Apps Configuration ---"
          cat "$APPS_FILE"
          echo "--------------------------"

          # Validate JSON syntax before encoding
          jq . "$APPS_FILE" || { echo "ERROR: Invalid JSON in $APPS_FILE"; exit 1; }

          APPS_JSON_BASE64=$(base64 -w 0 < "$APPS_FILE")
          echo "APPS_JSON_BASE64=${APPS_JSON_BASE64}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.prepare.outputs.tags }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ steps.versions.outputs.FRAPPE_VERSION }}
            PYTHON_VERSION=${{ steps.versions.outputs.PYTHON_VERSION }}
            NODE_VERSION=${{ steps.versions.outputs.NODE_VERSION }}
            APPS_JSON_BASE64=${{ steps.encode.outputs.APPS_JSON_BASE64 }}
          cache-from: type=registry,ref=${{ steps.prepare.outputs.base_path }}:cache
          cache-to: type=inline

      - name: Deployment Summary
        run: |
          echo "### :rocket: Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.prepare.outputs.tags }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          echo "### :x: Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "Please check the 'Validate and Encode' or 'Build' step logs." >> $GITHUB_STEP_SUMMARY
