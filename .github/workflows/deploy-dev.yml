name: Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  # Pulling image name from secrets now
  IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
  ENVIRONMENT: develop

jobs:
  build-and-deploy:
    name: Build & Deploy to DEV
    runs-on: ubuntu-latest
    environment: Deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          # Note: Ensure these secrets are defined in GitHub Settings > Secrets > Actions
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "VERSION=develop" >> $GITHUB_OUTPUT

      - name: Load versions from build.env
        id: versions
        run: |
          if [ -f "ci/build.env" ]; then
            source ci/build.env
            echo "FRAPPE_VERSION=${FRAPPE_VERSION}" >> $GITHUB_OUTPUT
            echo "PYTHON_VERSION=${PYTHON_VERSION}" >> $GITHUB_OUTPUT
            echo "NODE_VERSION=${NODE_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "ERROR: ci/build.env not found!"
            exit 1
          fi

      - name: Prepare apps.json
        run: |
          if [ -f "ci/apps-develop.json" ]; then
            cp ci/apps-develop.json ci/apps.json
          elif [ -f "ci/apps.json" ]; then
            echo "Using default apps.json"
          else
            echo "ERROR: No apps.json found!"
            exit 1
          fi

      - name: Encode apps.json to base64
        id: encode
        run: |
          APPS_JSON_BASE64=$(base64 -w 0 < ci/apps.json)
          echo "APPS_JSON_BASE64=${APPS_JSON_BASE64}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY_URL }}/${{ secrets.DOCKER_ORG }}/${{ env.IMAGE_NAME }}:develop
            ${{ secrets.DOCKER_REGISTRY_URL }}/${{ secrets.DOCKER_ORG }}/${{ env.IMAGE_NAME }}:develop-${{ steps.meta.outputs.COMMIT_SHA }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ steps.versions.outputs.FRAPPE_VERSION }}
            PYTHON_VERSION=${{ steps.versions.outputs.PYTHON_VERSION }}
            NODE_VERSION=${{ steps.versions.outputs.NODE_VERSION }}
            APPS_JSON_BASE64=${{ steps.encode.outputs.APPS_JSON_BASE64 }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY_URL }}/${{ secrets.DOCKER_ORG }}/${{ env.IMAGE_NAME }}:develop
          cache-to: type=inline
          labels: |
            org.opencontainers.image.title=Brand Club DEV
            org.opencontainers.image.version=develop
            org.opencontainers.image.created=${{ steps.meta.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Deployment Summary
        if: success()
        run: |
          echo "### :rocket: Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ secrets.DOCKER_REGISTRY_URL }}/${{ secrets.DOCKER_ORG }}/${{ env.IMAGE_NAME }}:develop" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "### :x: Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "Check the 'Log in to GitHub Container Registry' or 'Build' steps for credential errors." >> $GITHUB_STEP_SUMMARY
